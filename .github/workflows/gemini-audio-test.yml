name: Gemini Kreyol audio test

# Makes a short two host Kreyol sample with the Gemini API, fully in the cloud.
# Runs when _build/audio-test/run.txt changes (or by hand). Needs the GEMINI_API_KEY secret.
on:
  push:
    branches: [main]
    paths: ['_build/audio-test/run.txt']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gemini-audio-test
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Make the sample
        env:
          K0: ${{ secrets.SHEKINAH }}
          K1: ${{ secrets.GEMINI_API_KEY }}
          K2: ${{ vars.GEMINI_API_KEY }}
          K3: ${{ secrets.GEMINI_KEY }}
          K4: ${{ secrets.GOOGLE_API_KEY }}
          K5: ${{ secrets.GEMINI_API }}
        run: |
          mkdir -p assets/audio/tests
          for n in K0 K1 K2 K3 K4 K5; do v="${!n}"; if [ -n "$v" ]; then echo "key found in $n (length ${#v})"; export GEMINI_API_KEY="$(echo -n "$v" | tr -d '[:space:]')"; break; fi; done
          [ -n "$GEMINI_API_KEY" ] || echo "no key found in secrets SHEKINAH, GEMINI_API_KEY, GEMINI_KEY, GOOGLE_API_KEY, GEMINI_API or variable GEMINI_API_KEY" | tee _build/audio-test/last-run.log
          python3 _build/gemini_audio.py _build/audio-test/sample-script.txt assets/audio/tests/gemini-sample.mp3 --minutes 2 2>&1 | tee -a _build/audio-test/last-run.log
      - name: Save the sample
        if: always()
        run: |
          git config user.name "shekinah-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/tests _build/audio-test/last-run.log || true
          if git diff --cached --quiet; then echo "Nothing to save"; else git commit -m "Gemini audio test sample" && git pull --rebase && git push; fi
