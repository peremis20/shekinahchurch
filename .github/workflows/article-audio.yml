name: Article audio

# Makes natural narration for English blog articles.
# Default: Kokoro, a free open source voice that runs right here on GitHub (no key, no limits).
# Optional: set the repository variable TTS_ENGINE=elevenlabs and the secret ELEVENLABS_API_KEY.
# Paused Oct 31, 2026: Jimmy uses his own podcast audio for now. Run manually only.
on:
  workflow_dispatch:
    inputs:
      only_slug:
        description: 'Re-make the audio for one article slug (optional)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write

concurrency:
  group: article-audio
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: .github/workflows/article-audio.yml

      - name: Install voice engine
        if: vars.TTS_ENGINE != 'elevenlabs'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.2" soundfile numpy

      - name: Cache voice model
        if: vars.TTS_ENGINE != 'elevenlabs'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Make missing narration
        env:
          TTS_ENGINE: ${{ vars.TTS_ENGINE }}
          KOKORO_VOICE: ${{ vars.KOKORO_VOICE }}
          MAX_ARTICLES: ${{ vars.TTS_MAX_ARTICLES }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE: ${{ vars.ELEVENLABS_VOICE }}
          MAX_CHARS: ${{ vars.ELEVENLABS_MAX_CHARS }}
          ONLY_SLUG: ${{ github.event.inputs.only_slug }}
        run: |
          for v in TTS_ENGINE KOKORO_VOICE MAX_ARTICLES ELEVENLABS_VOICE MAX_CHARS; do [ -n "${!v}" ] || unset $v; done
          python3 _build/tts.py

      - name: Commit audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "shekinah-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/posts
          if git diff --cached --quiet; then
            echo "No new audio."
          else
            git commit -m "Article audio: add narration"
            git pull --rebase -q origin main
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
