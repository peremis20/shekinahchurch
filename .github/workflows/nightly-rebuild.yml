name: Nightly rebuild

# Every night, pull the latest posts, sermons and ministries saved in the admin
# and refresh the pre-rendered pages and sitemap so Google can index them.
on:
  schedule:
    - cron: '17 8 * * *'   # about 3:17 AM Central
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: nightly-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install renderer
        run: |
          mkdir -p "$RUNNER_TEMP/nm"
          npm install --prefix "$RUNNER_TEMP/nm" --no-save --no-audit --no-fund playwright@1.47.2 react@18.3.1 react-dom@18.3.1
          "$RUNNER_TEMP/nm/node_modules/.bin/playwright" install --with-deps chromium

      - name: Build pages
        env:
          NODE_PATH: ${{ runner.temp }}/nm/node_modules
          RX_MODULES: ${{ runner.temp }}/nm/node_modules
          PRERENDER_DIR: ${{ runner.temp }}/prerender
          REQUIRE_LIVE: '1'
        run: python3 _build/build.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "shekinah-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes tonight."
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Nightly rebuild: refresh pages from admin content"
            git push
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Pages
        if: steps.commit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
