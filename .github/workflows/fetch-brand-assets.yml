name: Fetch podcast brand assets (one time)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Amazon Music badge kit
        run: |
          mkdir -p _build/brand/amazon
          cd _build/brand/amazon
          curl -sSfL -o kit.zip "https://podcaster-portal-promo-tools.s3.us-west-1.amazonaws.com/WW+Listen+on+Amazon+Music.zip"
          unzip -o -q kit.zip -d kit && rm kit.zip
          find kit -type f | head -100 > files.txt
          cat files.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add _build/brand
          git commit -m "Brand assets: official Amazon Music badge kit" || echo nothing
          git pull --rebase origin main && git push
