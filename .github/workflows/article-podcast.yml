name: Article podcast

# Turns new English articles into NotebookLM podcast episodes in the church notebook.
# Needs the repository secret NOTEBOOKLM_AUTH_JSON (contents of storage_state.json after `notebooklm login`).
on:
  push:
    branches: [main]
    paths: ['content-defaults.json']
  schedule:
    - cron: '23 11 * * *'   # daily catch up, about 6:23 AM Central
  workflow_dispatch:
    inputs:
      only_slug:
        description: 'Make or remake the episode for one article slug (optional)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write

concurrency:
  group: article-podcast
  cancel-in-progress: false

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
      NOTEBOOKLM_NOTEBOOK: 7d7c2fb4-935e-400c-8f79-ad746062a7fb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q notebooklm-py

      - name: Check NotebookLM login
        if: env.NOTEBOOKLM_AUTH_JSON != ''
        run: notebooklm auth check --test --json

      - name: Make episodes
        env:
          MAX_EPISODES: ${{ vars.PODCAST_MAX_EPISODES }}
          PODCAST_FORMAT: ${{ vars.PODCAST_FORMAT }}
          PODCAST_LENGTH: ${{ vars.PODCAST_LENGTH }}
          ONLY_SLUG: ${{ github.event.inputs.only_slug }}
        run: python3 _build/podcast.py

      - name: Commit episodes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "shekinah-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/podcast 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new episodes."
          else
            git commit -m "Article podcast: add NotebookLM episodes"
            git pull --rebase -q origin main
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
