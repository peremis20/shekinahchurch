<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RSVP | Shekinah SDA Church</title><meta name="description" content="Let Shekinah Haitian SDA Church know you are coming."><meta name="robots" content="noindex"><link rel="icon" href="/favicon.ico?v=3" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DBRNW7DHZH"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag("js",new Date());var shkIn=false;try{shkIn=localStorage.getItem("shk_internal")==="1"}catch(e){}gtag("config","G-DBRNW7DHZH",shkIn?{traffic_type:"internal"}:{});</script>
<style>
:root{--navy:#13294B;--cream:#FAF6EE;--gold:#E2B85C;--line:#EDE5D3;--ink:#3D4554}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--navy) 0,var(--navy) 230px,var(--cream) 230px);color:var(--ink);font-family:'Mulish',system-ui,sans-serif;font-size:17px;line-height:1.6}
header{display:flex;justify-content:center;padding:22px 20px 26px}header img{height:52px;width:auto;display:block}
main{max-width:560px;margin:0 auto;padding:0 16px 48px}
.card{background:#fff;border-radius:24px;box-shadow:0 18px 48px rgba(19,41,75,.16);overflow:hidden}
.top{padding:28px 28px 22px;border-bottom:1px solid var(--line)}
.kick{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);background:#F3E3BC;border-radius:40px;padding:5px 12px;margin-bottom:12px}
h1{font-family:'Libre Baskerville',serif;color:var(--navy);font-size:clamp(24px,6vw,32px);line-height:1.25;margin:0 0 14px}
.facts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.facts li{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);font-size:16px}
.facts svg{width:20px;height:20px;flex:none;fill:none;stroke:#8A6420;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.desc{margin:14px 0 0;color:var(--ink)}
form,.done,.msg{padding:24px 28px 28px}
label{display:block;font-weight:800;color:var(--navy);font-size:15px;margin:0 0 6px}
input[type=text],input[type=email]{width:100%;height:52px;border:1.5px solid #D9D2C1;border-radius:14px;padding:0 16px;font:600 17px Mulish,system-ui,sans-serif;color:var(--navy);background:#fff;margin-bottom:18px}
input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px rgba(19,41,75,.12)}
.count{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.count button{width:52px;height:52px;border-radius:50%;border:1.5px solid #D9D2C1;background:#fff;font:800 26px Mulish,system-ui,sans-serif;color:var(--navy);cursor:pointer;line-height:1}
.count button:active{transform:scale(.96)}
.count output{min-width:56px;text-align:center;font:800 30px Mulish,system-ui,sans-serif;color:var(--navy)}
.count span{color:#6B6F78;font-weight:600;font-size:15px}
.go{width:100%;height:56px;border:0;border-radius:40px;background:var(--gold);color:var(--navy);font:800 18px Mulish,system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 16px rgba(138,100,32,.25)}
.go:hover{background:#d6a83f}.go[disabled]{opacity:.6;cursor:wait}
.err{color:#B42318;font-weight:700;font-size:15px;margin:-6px 0 14px;min-height:0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{text-align:center}.done .ok{width:64px;height:64px;border-radius:50%;background:#DDF3E2;display:grid;place-items:center;margin:4px auto 14px}.done .ok svg{width:32px;height:32px;fill:none;stroke:#1D6A34;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.done h2{font-family:'Libre Baskerville',serif;color:var(--navy);font-size:24px;margin:0 0 8px}.done p{margin:0 0 6px}
.done a{display:inline-block;margin-top:14px;color:var(--navy);font-weight:800}
.msg{text-align:center;color:var(--navy);font-weight:700}
.hide{display:none!important}
footer{text-align:center;font-size:14px;color:#6B6F78;margin-top:22px}footer a{color:#6B6F78}
</style></head><body>
<header><a href="/"><img src="/assets/logo-dark.png?v=4" alt="Shekinah Haitian Seventh-day Adventist Church" width="191" height="52"></a></header>
<main>
  <div class="card">
    <div class="msg" id="loading">Loading...</div>
    <div class="top hide" id="top">
      <span class="kick">You're invited</span>
      <h1 id="title"></h1>
      <ul class="facts" id="facts"></ul>
      <p class="desc hide" id="desc"></p>
    </div>
    <form id="f" class="hide" novalidate>
      <label for="n">Your name</label>
      <input type="text" id="n" autocomplete="name" required maxlength="120">
      <label for="em">Email</label>
      <input type="email" id="em" autocomplete="email" inputmode="email" required maxlength="254">
      <label>How many people are coming, you included?</label>
      <div class="count"><button type="button" id="minus" aria-label="One less">&minus;</button><output id="g" aria-live="polite">1</output><button type="button" id="plus" aria-label="One more">+</button><span id="gl">person</span></div>
      <div class="hp" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" tabindex="-1" autocomplete="off"></div>
      <p class="err" id="err" role="alert"></p>
      <button class="go" id="go" type="submit">Count me in</button>
    </form>
    <div class="done hide" id="done">
      <div class="ok"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
      <h2>See you there!</h2>
      <p id="dmsg"></p>
      <a href="/plan-your-visit/">Plan your visit</a>
    </div>
    <div class="msg hide" id="closed"></div>
  </div>
  <footer>Shekinah Haitian Seventh-day Adventist Church, Alvarado, Texas &middot; <a href="/privacy/">Privacy</a></footer>
</main>
<script>
(function(){
  var API='https://br-old-sea-b51wuht3-api.compute.c-7.us-east-2.aws.neon.tech/rsvp';
  var $=function(i){return document.getElementById(i);};
  var code=(new URLSearchParams(location.search).get('e')||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  var n=1,EV=null;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var IC={cal:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',pin:'<path d="M12 21s-6.5-6-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/>'};
  function fact(i,t){return '<li><svg viewBox="0 0 24 24" aria-hidden="true">'+IC[i]+'</svg>'+esc(t)+'</li>';}
  function niceDate(d){var p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
  function niceTime(t){if(!t)return '';var p=t.split(':'),h=+p[0];return (h%12||12)+':'+p[1]+' '+(h<12?'AM':'PM');}
  function show(id){['loading','top','f','done','closed'].forEach(function(x){$(x).classList.toggle('hide',id.indexOf(x)<0);});}
  function setN(v){n=Math.max(1,Math.min(50,v));$('g').textContent=n;$('gl').textContent=n===1?'person':'people';}
  $('minus').onclick=function(){setN(n-1);};$('plus').onclick=function(){setN(n+1);};
  function fail(m){$('closed').textContent=m;show(['closed']);}
  if(!code){fail('This RSVP link is not complete. Please scan the QR code again.');return;}
  fetch(API+'?e='+encodeURIComponent(code)).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'');return j;});}).then(function(j){
    EV=j.event;document.title=EV.title+' | RSVP | Shekinah SDA Church';
    $('title').textContent=EV.title;
    $('facts').innerHTML=fact('cal',niceDate(EV.date))+(EV.time?fact('clock',niceTime(EV.time)):'')+(EV.location?fact('pin',EV.location):'');
    if(EV.description){$('desc').textContent=EV.description;$('desc').classList.remove('hide');}
    if(EV.closed||EV.past){$('closed').textContent=EV.past?'This event has already happened. Thank you for your interest!':'RSVPs for this event are closed.';show(['top','closed']);}
    else show(['top','f']);
  }).catch(function(e){fail(e.message||'We could not load this event. Please try again.');});
  $('f').addEventListener('submit',function(e){e.preventDefault();var name=$('n').value.trim(),em=$('em').value.trim();
    if(!name){$('err').textContent='Please add your name.';$('n').focus();return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){$('err').textContent='Please enter a valid email address.';$('em').focus();return;}
    $('err').textContent='';$('go').disabled=true;$('go').textContent='Sending...';
    fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({e:code,name:name,email:em,guests:n,website:$('website').value})})
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Please try again.');return j;});})
    .then(function(j){$('dmsg').textContent=(j.updated?'We updated your RSVP: ':'We saved your RSVP: ')+n+(n===1?' person':' people')+' for '+EV.title+'.';show(['top','done']);try{gtag('event','rsvp',{event_title:EV.title,guests:n});}catch(x){}})
    .catch(function(x){$('err').textContent=x.message;})
    .then(function(){$('go').disabled=false;$('go').textContent='Count me in';});});
})();
</script>
</body></html>
