<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Website Report | Shekinah SDA Church</title>
<link rel="icon" href="/favicon.ico?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F8;--card:#FFFFFF;--line:#E2E8F1;--ink:#14213D;--muted:#5D6A80;--soft:#F6F8FC;--navy:#13294B;--gold:#C9A24A;
  --shadow:0 2px 6px rgba(20,33,61,.06),0 8px 24px rgba(20,33,61,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Mulish,system-ui,sans-serif;font-size:16px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:14px 16px}
header .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
header img{height:52px;width:auto;display:block}
header span{font-weight:800;color:#E8D6A6;font-size:14px;letter-spacing:.4px}
main{max-width:1180px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:18px}
h1{font-family:"Libre Baskerville",Georgia,serif;font-size:26px;margin:0}
.lead{margin:4px 0 0;color:var(--muted)}
.panel{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.page{padding:20px}
.sec-h,.kpi b{font-family:"Libre Baskerville",Georgia,serif}
.sec-h{font-size:19px;font-weight:800;margin:6px 0 0}
.meta{margin-top:8px;font-size:14px;color:var(--muted)}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:28px;font-weight:900}
.kpi span{color:var(--muted);font-weight:600}
.wr-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:6px}
.wr-k .kpi small{display:block;margin-top:4px;font-weight:800;font-size:13px}.up{color:#1D6A34}.down{color:#B42318}.flat{color:var(--muted)}
.wr-chart{width:100%;height:auto;display:block}.wr-chart text{font:12px Mulish,system-ui,sans-serif;fill:#6B7487}
.wr-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--muted);margin:4px 0 6px}.wr-leg i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.wr-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:18px}
.wr-bar{position:relative}.wr-bar span{position:absolute;left:0;top:50%;transform:translateY(-50%);height:22px;border-radius:6px;background:#E6EEFB;z-index:0}.wr-bar b,.wr-bar em{position:relative;z-index:1}
.rtable{width:100%;border-collapse:collapse;font-size:15px}
.rtable th,.rtable td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
.rtable th{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.rtable td.n,.rtable th.n{text-align:right}
.rtable td.t{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rep{display:flex;flex-direction:column;gap:18px}
@media (max-width:520px){.wr-k{grid-template-columns:1fr 1fr}.kpi b{font-size:24px}}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 30px}
</style>
</head>
<body>
<header><div class="in"><a href="/"><img src="/assets/logo-dark.png?v=4" alt="Shekinah Haitian Seventh-day Adventist Church" width="190" height="52" style="aspect-ratio:190/52"></a><span>VIEW ONLY REPORT</span></div></header>
<main>
  <div><h1>Website visitors</h1><p class="lead">How shekinahsda.org is reaching people, updated every morning.</p></div>
  <div id="rep"><div class="panel page"><p class="meta">Loading the numbers...</p></div></div>
</main>
<footer>Shekinah Haitian Seventh-day Adventist Church · Alvarado, Texas</footer>
<script src="/assets/webreport.js?v=2"></script>
<script>
(function(){
  var API='https://br-old-sea-b51wuht3-api.compute.c-7.us-east-2.aws.neon.tech';
  var box=document.getElementById('rep');
  function msg(t){box.innerHTML='<div class="panel page"><p class="meta" style="margin:0">'+t+'</p></div>';}
  fetch(API+'/reports/view').then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Error');return j;});})
    .then(function(j){if(!j.report){msg('The first daily update has not run yet. Please check back tomorrow.');return;}box.innerHTML=window.shkWebReport(j.report);})
    .catch(function(e){msg(/not active/i.test(e.message)?'This report is not shared right now. Please check with the church office.':'Could not load the numbers right now. Please try again in a moment.');});
})();
</script>
</body>
</html>
